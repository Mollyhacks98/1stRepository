<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login + RPG Demo</title>
  <link rel="stylesheet" href="minigamestylesheet.css">
</head>
<body>

  <!-- Login Section -->
  <div id="loginSection" class="section">
    <h2>Welcome to my MiniGame!!</h2>
    <p>Jump into this small mini adventure where you battle monsters again and again until you can’t no more!</p>
    
    <input type="text" id="username" placeholder="Username"><br><br>
    <input type="number" id="age" placeholder="Age"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>

    <label>Choose Your Hero:</label>
    <select id="heroClass">
      <option value="warrior">Warrior</option>
      <option value="mage">Mage</option>
      <option value="rogue">Rogue</option>
    </select><br><br>

    <button onclick="validateLogin()">Login</button>
    <p id="loginMessage"></p>
  </div>

  <!-- RPG Section -->
  <div id="rpgSection" class="section" style="display:none;">
    <h2>Welcome, <span id="playerName"></span>!</h2>
    
    <h3>Your Hero</h3>
    <img id="heroImage" src="" alt="Hero" width="120"><br>
    <p id="heroStats"></p>
    
    <h3>Enemy</h3>
    <img id="enemyImage" src="" alt="Enemy" width="120"><br>
    <p id="enemyStats"></p>

    <button onclick="attackEnemy()">Attack</button>
    <button onclick="healHero()">Heal</button>
    <button onclick="useSpecial()">Special Move</button>

    <p id="battleLog"></p>
  </div>

    <script src="minigame.js"></script>

</body>
</html>
